<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GibJohn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('resources') }}">Resources</a>
        <a href="{{ url_for('quiz') }}">Quiz</a>
        <a href="{{ url_for('about') }}">About</a>
    </div>

    <div class="nav-center">
        <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='images/GibJohn Tutoring Logo with Book and Lightbulb Icon.png') }}" alt="Logo">
        </a>
    </div>

    <div class="nav-right">
        <a href="{{ url_for('account') }}">Account</a>

        {% if user %}
            <a href="{{ url_for('logout') }}" class="btn-outline">Logout</a>
        {% else %}
            <button onclick="openLogin()" class="btn-ghost">Login</button>
            <button onclick="openRegister()" class="btn-primary">Register</button>
        {% endif %}
    </div>
</header>

<main class="main-content">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>© 2026 GibJohn Tutoring. Built with clarity.</p>
</footer>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
    <div class="modal-box">
        <button class="close-btn" onclick="closeLogin()">×</button>
        <h2>Login</h2>
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-primary full">Login</button>
        </form>
    </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
    <div class="modal-box">
        <button class="close-btn" onclick="closeRegister()">x</button>
        <h2>Create Account</h2>
        <form method="POST" action="/register">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-primary full">Register</button>
        </form>
    </div>
</div>

<script>
    const loginModal = document.getElementById("loginModal");
    const registerModal = document.getElementById("registerModal");
    
    function openLogin() {
        loginModal.style.display = "flex";
    }
    
    function closeLogin() {
        loginModal.style.display = "none";
    }
    
    function openRegister() {
        registerModal.style.display = "flex";
    }
    
    function closeRegister() {
        registerModal.style.display = "none";
    }
    
    /* Close when clicking outside */
    window.onclick = function(event) {
        if (event.target === loginModal) {
            closeLogin();
        }
        if (event.target === registerModal) {
            closeRegister();
        }
    }
    
    /* Close with Escape key */
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
            closeLogin();
            closeRegister();
        }
    });
    </script>

</body>
</html>
