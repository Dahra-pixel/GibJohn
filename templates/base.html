<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GibJohn</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<body>

    <!-- Navigation links -->
    <nav>
        <ul>
            <li><a href="{{ url_for('resources') }}">Resources</a></li>
            <li><a href="{{ url_for('quiz') }}">Quiz</a></li>

            <li class="nav_logo">
                <a href="{{ url_for('home') }}">
                    <img src="{{ url_for('static', filename='images/GibJohn Tutoring Logo with Book and Lightbulb Icon.png') }}" alt="">
                </a>
            </li>

            <li><a href="{{ url_for('contact') }}">Contact</a></li>
            
            {% if user %}
                <!-- <li><a href="#">Hi, {{ user }}</a></li> -->
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            {% else %}
                <li><a href="#" onclick="openLogin()">Login</a></li>
                <li><a href="#" onclick="openRegister()">Register</a></li>
            {% endif %}
            <li><a href="{{ url_for('about') }}">About</a></li>
        </ul>
    </nav>


    <main>
        {% block content %}
        <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeLogin()">&times;</span>
        <h2>Login</h2>
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    </div>
    <!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeRegister()">&times;</span>
    <h2>Register</h2>
    <form method="POST" action="/register">
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
  </div>
</div>



<script>
function openLogin() {
    document.getElementById("loginModal").style.display = "block";
}

function closeLogin() {
    document.getElementById("loginModal").style.display = "none";
}

function openRegister() {
    document.getElementById("registerModal").style.display = "block";
}

function closeRegister() {
    document.getElementById("registerModal").style.display = "none";
}

function logout() {
    document.getElementById("logoutBtn").style.display = "none";
    alert("Logged out");
}
</script>
        {% endblock %}
    </main>
    

    <footer> ... </footer>
    
</body>
</html>
