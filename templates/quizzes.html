{% extends "base.html" %}
{% block content %}

<section class="quiz-wrapper">

    <div class="quiz-card fade-in" id="quiz-box">

        <div class="quiz-header">
            <h2>Quiz</h2>

            <div class="quiz-top">
                <div class="progress-text" id="progress"></div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div> 
            </div>
        </div>


        <div class="quiz-body">

            <h3 id="question" class="question-text"></h3>

            <div id="answers" class="answers-grid">
                <!-- JS will inject answers here -->
            </div>

        </div>


        <div class="quiz-actions">

            <button id="next-btn" class="btn-primary" onclick="nextQuestion()" disabled>
                Next →
            </button>

            <button id="submit-btn" type="button" class="btn-primary" onclick="submitQuiz()" style="display:none;">
                Finish Quiz
                return 
                <a href="{{ url_for('report', result_id=loop.index) }}" class="report-btn">
                    View Report
                </a>
            </button>

        </div>

    </div>

</section>

<script>

    let currentQuiz = []
    let currentIndex = 0
    let score = 0
    
    
    async function loadQuiz(){
    
        const response = await fetch("/api/quiz/Quiz1")
        const data = await response.json()
    
        currentQuiz = data.quiz
    
        loadQuestion()
    }
    
    
    function loadQuestion() {
    
        const q = currentQuiz[currentIndex]
    
        document.getElementById("question").innerText = q.question
    
        const answersBox = document.getElementById("answers")
        answersBox.innerHTML = ""
    
        q.answers.forEach(answer => {
    
            const btn = document.createElement("button")
            btn.className = "answer-btn"
            btn.innerText = answer
    
            btn.onclick = () => selectAnswer(answer)
    
            answersBox.appendChild(btn)
    
        })
    
        updateProgress()
    }
    
    
    function selectAnswer(answer){

        const correct = currentQuiz[currentIndex].correct

        if(answer === correct){
            score++
        }

        document.querySelectorAll(".answer-btn").forEach(btn => {
            btn.disabled = true
        })

        document.getElementById("next-btn").disabled = false
        }
    
    
        function nextQuestion(){

            currentIndex++

            if(currentIndex === currentQuiz.length){

                document.getElementById("question").innerText = "Quiz Complete!"
                document.getElementById("answers").innerHTML = ""

                document.getElementById("next-btn").style.display = "none"
                document.getElementById("submit-btn").style.display = "inline-block"

                return
            }

loadQuestion()
document.getElementById("next-btn").disabled = true
}
    
    
    function updateProgress(){
    
        const progressText = document.getElementById("progress")
        const progressFill = document.getElementById("progress-fill")
    
        progressText.innerText = `Question ${currentIndex + 1} / ${currentQuiz.length}`
    
        const percent = ((currentIndex + 1) / currentQuiz.length) * 100
        progressFill.style.width = percent + "%"
    }
    
    
    async function submitQuiz(){

        await fetch("/submit_quiz", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                score: score,
                total: currentQuiz.length
            })
        });

        window.location.href = "/report";
        }


    
    
    loadQuiz()
    
    </script>

{% endblock %}
