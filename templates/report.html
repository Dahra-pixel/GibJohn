{% extends "base.html" %}
{% block content %}

<section class="report-wrapper">

    <div class="report-card">

        <h2>Quiz Report</h2>

        <div class="report-score">
            <span class="score-number">{{ score }}/{{ total }}</span>
            <span class="score-percent">{{ percentage }}%</span>
        </div>

        <div class="report-details">
            <p><strong>Date:</strong> {{ date }}</p>
        </div>

        <a href="/quiz" class="btn-primary report-btn">Take another quiz</a>

    </div>

</section>



    <style>
        .report-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: linear-gradient(135deg,#eef3f1,#cbdcd6);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
            font-family: 'Poppins', sans-serif;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #b2c5c5;
            border-radius: 12px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #356663;
            border-radius: 12px 0 0 12px;
            transition: width 1s ease-in-out;
        }
    </style>

{% endblock %}
